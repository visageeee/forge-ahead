name: Build Forge Ahead desktops
on:
  push:
    branches: [weland-gtk3]
    tags: ['v*', '20*']
  pull_request:
    branches: [weland-gtk3]
  workflow_dispatch:
    inputs:
      draft_release:
        description: Build packages and prepare a draft release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/BoxToolTests.csproj -c Release
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2022
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gtk3 mingw-w64-ucrt-x86_64-librsvg mingw-w64-ucrt-x86_64-adwaita-icon-theme
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./packaging/windows.ps1
      - name: Install GTK on Mac
        if: runner.os == 'macOS'
        run: brew install gtk+3 librsvg adwaita-icon-theme
      - name: Package Mac
        if: runner.os == 'macOS'
        run: python3 packaging/macos.py '${{ matrix.rid }}'
      - name: Package Linux
        if: runner.os == 'Linux'
        run: bash packaging/linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: forge-ahead-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.draft_release) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/weland-gtk3' && contains(github.event.head_commit.message, '[draft release]'))
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-ahead-*
          path: downloads
          merge-multiple: true
      - name: Prepare draft release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            release_tag="$RELEASE_REF_NAME"
          else
            release_tag="$(tr -d '\r\n' < packaging/RELEASE-VERSION)"
          fi
          if [[ ! "$release_tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo 'Invalid release version' >&2
            exit 1
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$release_tag" --json isDraft --jq .isDraft)" != true ]]; then
              echo 'Refusing to replace assets on an already published release' >&2
              exit 1
            fi
            gh release edit "$release_tag" --draft --notes-file packaging/RELEASE-NOTES.md
          else
            gh release create "$release_tag" --draft --target "$GITHUB_SHA" --title "Forge Ahead $release_tag" --notes-file packaging/RELEASE-NOTES.md
          fi
          gh release upload "$release_tag" downloads/*.zip downloads/*.tar.gz --clobber
